<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Split Scroll</h1>

  <label class="toggle-row">
    <span class="label-text">Split scrolling</span>
    <input type="checkbox" id="enabled" checked>
    <span class="slider"></span>
  </label>

  <label class="toggle-row">
    <span class="label-text">Sticky player</span>
    <input type="checkbox" id="stickyPlayer">
    <span class="slider"></span>
  </label>

  <label class="toggle-row">
    <span class="label-text">Hide scrollbars</span>
    <input type="checkbox" id="hideScrollbars" checked>
    <span class="slider"></span>
  </label>

  <p class="hint">Changes apply instantly to open YouTube tabs.</p>

  <script src="popup.js"></script>
</body>
</html>
